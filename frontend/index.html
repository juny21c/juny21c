<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문 관상 풀이</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 전문 관상 풀이</h1>
            <p class="subtitle">30년 경력 관상가의 노하우로 당신의 운세를 풀이해드립니다</p>
            <div class="usage-counter">
                <p>남은 분석 횟수: <strong id="remainingCount">1회</strong></p>
                <p class="share-bonus">💡 친구에게 공유하면 <strong>1회 더!</strong></p>
            </div>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-box" id="uploadBox">
                    <!-- 카메라로 찍기용 input -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
                    <!-- 앨범에서 선택용 input -->
                    <input type="file" id="galleryInput" accept="image/*" hidden>

                    <div class="upload-content">
                        <div class="upload-icon">📸</div>
                        <p class="upload-text">사진을 올려주세요</p>

                        <!-- 두 개 버튼으로 분리 -->
                        <div class="button-group">
                            <button class="btn-select btn-camera" id="btnCamera">
                                📷 사진 찍기
                            </button>
                            <button class="btn-select btn-gallery" id="btnGallery">
                                📁 사진 선택
                            </button>
                        </div>

                        <p class="upload-hint">JPG, PNG, GIF, WEBP 형식 지원</p>
                    </div>
                </div>

                <div class="preview-section" id="previewSection" style="display: none;">
                    <div class="preview-box">
                        <img id="previewImage" alt="미리보기">
                        <button class="btn-remove" id="btnRemove">다른 사진 선택</button>
                    </div>
                    <button class="btn-analyze" id="btnAnalyze">🔮 내 관상 보기</button>
                </div>
            </div>

            <div class="loading-section" id="loadingSection" style="display: none;">
                <div class="spinner"></div>
                <p>관상을 풀이하고 있습니다...</p>
                <p class="loading-hint">전문가의 노하우로 분석 중입니다 (30-60초 소요)</p>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h2>📊 내 관상 결과</h2>

                <!-- 분석한 사진 표시 -->
                <div class="analyzed-image-box">
                    <img id="analyzedImage" src="" alt="분석한 사진">
                </div>

                <!-- 분석 결과 -->
                <div class="result-box">
                    <div id="analysisResult"></div>
                </div>

                <!-- 카카오톡 공유 버튼 -->
                <div class="share-section">
                    <p class="share-text">친구들에게 공유하고 <strong>1회 더</strong> 받으세요!</p>
                    <button class="btn-share-kakao" id="btnShareKakao">
                        💬 카카오톡 공유하기
                    </button>
                </div>

                <button class="btn-retry" id="btnRetry">다시 해보기</button>
            </div>

            <div class="error-section" id="errorSection" style="display: none;">
                <div class="error-box">
                    <div class="error-icon">⚠️</div>
                    <h3>오류가 발생했습니다</h3>
                    <p id="errorMessage"></p>
                    <button class="btn-retry" id="btnErrorRetry">다시 시도</button>
                </div>
            </div>
        </main>

        <footer>
            <p>⚠️ 이 서비스는 재미와 오락을 목적으로 만들어졌습니다</p>
            <p>관상 분석 결과는 참고용이며 과학적 근거가 없습니다</p>
        </footer>
    </div>

    <!-- Kakao SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
