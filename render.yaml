services:
  - type: web
    name: face-reading-service
    env: python
    region: singapore
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: API_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false  # 수동으로 Render 대시보드에서 설정
      - key: PYTHON_VERSION
        value: 3.11.0
